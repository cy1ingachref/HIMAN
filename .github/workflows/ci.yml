name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The AC-6 metrics job runs on this schedule (03:17 UTC, off the hour).
  schedule:
    - cron: "17 3 * * *"
  # ...and can be started by hand.
  workflow_dispatch:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # Pinned to a commit SHA, not a floating tag. A compromised or moved tag
      # would otherwise run arbitrary code in CI with repository access.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      # The gate: the number of tests the binary reports must equal the
      # number that actually ran, and none may be ignored. A suite that is
      # silently skipped, filtered out, or marked `#[ignore]` fails here
      # rather than passing as "green with fewer tests".
      - name: Test count gate
        run: |
          set -euo pipefail
          # `--list` prints one "<name>: test" line per discovered test and a
          # final summary. Count the per-test lines only.
          LISTED=$(cargo test --workspace -- --list 2>/dev/null \
            | grep -c ': test$' || true)
          # Run the whole workspace and sum the "test result: ok. N passed"
          # lines. `--nocapture` is omitted so the output stays greppable.
          RUN_OUTPUT=$(cargo test --workspace 2>&1 || true)
          EXECUTED=$(printf '%s\n' "$RUN_OUTPUT" \
            | grep -oE 'test result: ok\. [0-9]+ passed' \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          IGNORED=$(printf '%s\n' "$RUN_OUTPUT" \
            | grep -oE '[0-9]+ ignored' | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "listed=$LISTED executed=$EXECUTED ignored=$IGNORED"
          if [ "$LISTED" -ne "$EXECUTED" ]; then
            echo "::error::test count mismatch: $LISTED listed, $EXECUTED executed"
            exit 1
          fi
          if [ "$IGNORED" -ne 0 ]; then
            echo "::error::$IGNORED test(s) ignored; zero is required"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace -- --nocapture

      - name: Report test summary
        if: always()
        run: |
          echo "## HIMAN CI results" >> $GITHUB_STEP_SUMMARY
          echo "- fmt: see log" >> $GITHUB_STEP_SUMMARY
          echo "- clippy: see log" >> $GITHUB_STEP_SUMMARY
          echo "- tests: see log" >> $GITHUB_STEP_SUMMARY

  e2e:
    name: end-to-end (real binaries)
    runs-on: ubuntu-latest
    # Real-binary tests spawn processes and sockets; without a ceiling a wedged
    # test would burn the whole job.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      # The e2e tests spawn the real binaries, so they must be built first.
      - name: Build binaries
        run: cargo build --workspace

      # A production release binary must not contain a fault-injection hook.
      # The hooks are behind agent-pc's `fault-injection` feature, and a default
      # build must not be able to misbehave when an environment variable is set.
      # Grep the built artifact for every hook's env-var string; any hit fails
      # the job. This catches a future hook that is added without the feature
      # gate, which a behaviour test would only catch if it knew to test it.
      - name: Release binary must not contain fault-injection hooks
        run: |
          set -euo pipefail
          cargo build --release -p himan-agent-pc
          BIN="target/release/himan-agent-pc"

          # Derive the hook names from the source rather than listing them, so
          # a hook added later without the feature gate is still caught.
          # Every fault hook is a `#[cfg(feature = "fault-injection")]` block
          # reading an HIMAN_TEST_* variable; find those variables.
          mapfile -t HOOKS < <(
            grep -oE 'HIMAN_TEST_[A-Z0-9_]+' agent-pc/src/*.rs | cut -d: -f2 | sort -u
          )
          if [ "${#HOOKS[@]}" -eq 0 ]; then
            echo "::error::no HIMAN_TEST_* hooks found; is the extraction broken?"
            exit 1
          fi
          echo "checking for hooks: ${HOOKS[*]}"

          found=0
          for hook in "${HOOKS[@]}"; do
            if grep -q "$hook" "$BIN"; then
              echo "::error::fault-injection hook $hook found in $BIN"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "release binary clean: none of ${HOOKS[*]} present"

      # The real-binary targets, explicitly: the old `e2e` target was deleted
      # once its unique checks moved onto the shared harness.
      - name: Run end-to-end tests
        run: |
          set -euo pipefail
          cargo test -p himan-orchestrator --test fast_roundtrip -- --nocapture
          cargo test -p himan-orchestrator --test handoff_http -- --nocapture
          cargo test -p himan-orchestrator --test ac1_happy_path -- --nocapture
          cargo test -p himan-orchestrator --test ac2_ac3 -- --nocapture
          cargo test -p himan-orchestrator --test ac4_matrix -- --nocapture
          cargo test -p himan-orchestrator --test inbound -- --nocapture
          cargo test -p himan-orchestrator --test fault_injection -- --nocapture
          cargo test -p himan-orchestrator --test stalled_owner -- --nocapture
          cargo test -p himan-orchestrator --test stalled_pending -- --nocapture
          cargo test -p himan-orchestrator --test durability -- --nocapture
          cargo test -p himan-orchestrator --test durable_audit -- --nocapture
          cargo test -p himan-orchestrator --test non_idempotent -- --nocapture

  # AC-6 handoff metrics: 12 cells (3 log sizes x 4 latencies) x 30 handoffs.
  # Each run is a real-binary scenario, so this is a long job; it runs nightly
  # rather than on every push. The CSV is uploaded as an artifact.
  metrics:
    name: handoff metrics (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-metrics-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-metrics-

      - name: Build binaries
        run: cargo build --workspace

      - name: Collect handoff metrics (30 runs)
        run: cargo run -p himan-orchestrator --example handoff_metrics

      - name: Upload metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handoff-metrics
          path: |
            orchestrator/results/handoff-metrics.csv
            orchestrator/results/handoff-metrics.md
          if-no-files-found: error
          # CI artifacts expire; keep the raw data long enough to compare runs.
          # The committed copy in docs/data/ is the permanent record.
          retention-days: 90

  # Dependency audit: fail on any known-vulnerable crate.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        # `--ignore` is scoped to the advisory, not a blanket allowance: it is
        # an "unmaintained" notice on `chrono` (RUSTSEC-2026-0543, published
        # 2026-09-14) with no fixed upgrade, and `chrono` is unchanged from
        # main. Any other advisory still fails the job.
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0543

  # Verify every pinned action SHA against its upstream tag.
  #
  # A pinned SHA that does not match the tag it claims is either a typo or a
  # supply-chain substitution. Two SHAs in this repo were invented by hand and
  # only failed at "Set up job"; this catches that at review time instead.
  action-pins:
    name: verify action pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Check each pinned action SHA against its upstream tag"
        run: |
          set -euo pipefail
          fail=0
          # Every `uses:` line that pins a 40-hex SHA and names a tag.
          while IFS= read -r line; do
            repo=$(printf '%s' "$line" | sed -E 's/.*uses: *([^@]+)@.*/\1/')
            sha=$(printf '%s' "$line" | sed -E 's/.*@([0-9a-f]{40}).*/\1/')
            tag=$(printf '%s' "$line" | sed -E 's/.*# *([^ ]+).*/\1/')
            printf '%-32s %-10s ' "$repo" "$tag"
            # A tag may be annotated, so dereference it: refs/tags/T^{} is
            # the commit the tag points at. Fall back to the tag itself.
            remote=$(git ls-remote "https://github.com/$repo" \
                       "refs/tags/$tag^{}" "refs/tags/$tag" 2>/dev/null \
                     | awk '{print $1}' | head -1)
            if [ -z "$remote" ]; then
              echo "FAIL: tag $tag does not exist upstream"
              fail=1
            elif [ "$remote" != "$sha" ]; then
              echo "FAIL: pinned $sha but tag $tag is $remote"
              fail=1
            else
              echo "ok"
            fi
          done < <(grep -hE 'uses: *[^@]+@[0-9a-f]{40} *# ' .github/workflows/*.yml)
          if [ "$fail" -ne 0 ]; then
            echo "One or more action pins do not match their tag." >&2
            exit 1
          fi

  # Secret scan: fail if a key or token is committed.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1

      - name: Scan for secrets
        run: |
          # gitleaks is a Go tool, not a crate: install the release binary.
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp
          /tmp/gitleaks detect --source . --verbose --redact --no-git
