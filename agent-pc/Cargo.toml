[package]
name = "himan-agent-pc"
description = "Windows PC agent for HIMAN"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "himan-agent-pc"
path = "src/main.rs"

[dependencies]
himan-proto = { path = "../proto" }
himan-agent-core = { path = "../agent-core" }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sysinfo = "0.32"
chrono.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
tempfile = "3"

[features]
# Fault injection for the acceptance tests. OFF by default: a production build
# must not contain the switches that make a real device refuse to answer a
# handoff. The e2e tests and the CI e2e job enable it explicitly.
fault-injection = []
# Debug-only escape hatch for loopback development against a plain ws://
# orchestrator. NEVER enabled in a release build (see INSECURE_WS_ALLOWED).
insecure-ws-dev = []
