[package]
name = "himan-orchestrator"
description = "Planner, policy engine, presence manager, state store, and WS hub"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "himan-orchestrator"
path = "src/bin/orchestrator.rs"

[dependencies]
himan-proto = { path = "../proto" }
himan-agent-core = { path = "../agent-core" }
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex = "0.4"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono.workspace = true
himan-agent-core = { path = "../agent-core" }
himan-agent-pc = { path = "../agent-pc" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
ureq = { version = "3", features = ["json"] }
