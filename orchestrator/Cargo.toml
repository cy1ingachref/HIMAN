[package]
name = "himan-orchestrator"
description = "Planner, policy engine, presence manager, state store, and WS hub"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "himan-orchestrator"
path = "src/bin/orchestrator.rs"

[dependencies]
himan-proto = { path = "../proto" }
himan-agent-core = { path = "../agent-core" }
socket2 = "0.6"
rustls = { version = "0.23", features = ["ring"] }
base64 = "0.22"
tokio-rustls = "0.26"
either = "1"

async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex = "0.4"
sha2 = "0.11"
subtle = "2"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
# `bundled` builds SQLite from the amalgamated source, so the orchestrator has
# no system-library dependency. WAL is enabled at runtime in `durable.rs`.
rusqlite = { version = "0.43", features = ["bundled", "serde_json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono.workspace = true
himan-agent-core = { path = "../agent-core" }
himan-agent-pc = { path = "../agent-pc" }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"
ureq = { version = "2", features = ["json", "tls"] }
rustls = { version = "0.23", features = ["ring"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Foundation"] }
